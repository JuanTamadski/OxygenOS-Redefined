name: NothingsVN Oplus ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL of the ROM to build'
        required: true
      
jobs:
  Initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Clean All Unused file,application
        run: |
          docker rmi `docker images -q` || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/sudo apt/sources.list.d || true
          sudo apt -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell mysql* php* || true
          sudo apt -y autoremove --purge || true
          sudo apt -y autoclean || true
          sudo apt clean || true

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Set up Time
        run: |
          echo "Setting Manila timezone"
          sudo timedatectl set-timezone Asia/Manila

  Build:
    needs: Initialize
    runs-on: ubuntu-latest
    steps:
      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install Stuff
        run: |
          sudo bash setup.sh
        
      - name: Giving permission
        run: |
          sudo chmod 777 -R *

      - name: Build and Pack ROM...
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          # Passing "y" here lets build.sh handle the entire pipeline natively
          sudo bash build.sh "$INPUT_URL" "y"

      # --- NEW: SSH Setup for rsync ---
      - name: Setup SSH for rsync upload
        run: |
          sudo mkdir -p /root/.ssh
          # Write the private key from GitHub Secrets
          echo "${{ secrets.SF_SSH_KEY }}" | sudo tee /root/.ssh/id_rsa > /dev/null
          sudo chmod 600 /root/.ssh/id_rsa
          
          # Add SourceForge to known_hosts to prevent interactive prompts
          # Change 'frs.sourceforge.net' if uploading elsewhere
          sudo ssh-keyscan -t rsa frs.sourceforge.net | sudo tee -a /root/.ssh/known_hosts > /dev/null
          
      - name: Upload ROM...
        run: |
          sudo -E bash uploadROM.sh
